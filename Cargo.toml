[workspace]
resolver = "2"
members = [
    "crates/gateway",
    "crates/proxy",
    "crates/routing",
    "crates/store-memory",
    "crates/pool-static",
    "crates/pool-k8s",
    "crates/auth",
    "crates/observability",
    "crates/config",
    "crates/genproto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/liangchi-hsieh/spark-connect-gateway"
publish = false
rust-version = "1.82"

[workspace.dependencies]
# Async + gRPC
tokio = { version = "1.41", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
prost = "0.14"
prost-types = "0.14"

# Logging + telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry-semantic-conventions = "0.31"
opentelemetry-stdout = "0.31"
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic", "trace"] }
tracing-opentelemetry = "0.32"

# Config + utilities
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"

# K8s
kube = { version = "3.1", features = ["runtime", "client"] }
k8s-openapi = { version = "0.27", features = ["latest"] }

# Auth
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
subtle = "2"

# Observability
prometheus = "0.14"
uuid = { version = "1", features = ["v4"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Test-only
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
