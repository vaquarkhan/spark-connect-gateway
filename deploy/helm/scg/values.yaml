# Default values for the spark-connect-gateway Helm chart.
# All knobs are documented inline. The defaults give you a 2-replica
# HA gateway in front of a static backend list, with a single-replica
# bundled Redis providing cross-replica session affinity. No auth, no
# OTel tracing — both opt-in.

# -- Optional override of the chart name (`{{ .Chart.Name }}`).
nameOverride: ""
# -- Override the full release name. Has no default; usually unused.
fullnameOverride: ""

image:
  repository: ghcr.io/liangchi-hsieh/spark-connect-gateway
  # -- Image tag. Defaults to the chart's appVersion when null.
  tag: ""
  pullPolicy: IfNotPresent
  # -- Optional image pull secrets, e.g. for private registries.
  pullSecrets: []

# -- Number of gateway replicas. Multi-replica HA requires
#    `affinityStore.type: redis` (default), otherwise stickiness
#    breaks across replicas.
replicaCount: 2

# -- Resources for the gateway container.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# -- Pod-level scheduling controls.
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Service exposing the gateway externally to clients (and the admin
# port to Prometheus / probes).
service:
  type: ClusterIP
  # gRPC port consumers connect to via `sc://...:15003`
  grpcPort: 15003
  # Admin port: /metrics, /healthz, /readyz
  adminPort: 9090

# Probes hit the admin port. /readyz returns 200 once the backend
# pool has at least one entry; /healthz returns 200 unconditionally.
probes:
  enabled: true
  livenessPath: /healthz
  readinessPath: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Backend discovery. `static` is the default; switch to `k8s` to
#    have the gateway watch a Spark Connect Service's Endpoints object
#    (the apache/spark-kubernetes-operator pattern).
backendDiscovery:
  # `static` or `k8s`
  type: static
  # Used when type=static. host:port entries.
  static:
    addresses:
      - "spark-connect-1.svc.cluster.local:15002"
      - "spark-connect-2.svc.cluster.local:15002"
  # Used when type=k8s. Watches the named Service's Endpoints.
  k8s:
    namespace: spark-connect
    serviceName: spark-connect
    port: 15002

# Authentication mode. Defaults to anonymous (no auth) — fine for a
# trusted in-cluster network, NOT for production exposure.
auth:
  # one of: none | static | jwt | oidc
  type: none

  # type: static — bearer-token allowlist
  static:
    tokens: []
    # - token: "alice-secret"
    #   userId: "alice"
    #   tenant: "team-a"
    #   groups: ["devs"]

  # type: jwt — local-key JWT verification
  jwt:
    algorithms: ["RS256"]
    issuer: ""
    audience: ""
    userIdClaim: "sub"
    tenantClaim: ""
    groupsClaim: ""
    # exactly one of {pemFile, pemInline, hmacSecret} required
    key:
      kind: pemInline   # pemFile | pemInline | hmacSecret
      pem: ""           # used when kind=pemInline
      path: ""          # used when kind=pemFile (path inside the pod)
      secret: ""        # used when kind=hmacSecret

  # type: oidc — remote JWKS / discovery
  oidc:
    algorithms: ["RS256"]
    issuer: ""
    audience: ""
    discoveryUrl: ""    # e.g. https://idp.example.com/.well-known/openid-configuration
    jwksUrl: ""         # used directly if you don't want discovery
    userIdClaim: "sub"
    tenantClaim: ""
    groupsClaim: ""
    refreshFloorSecs: 60

# Where the gateway keeps its (user_id, session_id) -> backend
# affinity table. Multi-replica deployments MUST use `redis` —
# memory store is per-pod and breaks Spark Connect's session
# invariant when load balancers fan out across replicas.
affinityStore:
  # one of: memory | redis
  type: redis
  redis:
    # Used only when redis.enabled=false (external Redis).
    # When redis.enabled=true the chart synthesizes the URL from the
    # bundled StatefulSet; set this to override.
    url: ""
    keyPrefix: scg
    sessionTtlSecs: 3600
    opTtlSecs: 900

# Bundled Redis StatefulSet. Disable to bring your own (managed
# Redis, ElastiCache, Bitnami Redis chart, etc.) and set
# affinityStore.redis.url to point at it.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce

# Per-tenant rate limiting (Phase 3.6). Token-bucket per tenant
# (and optionally per-user inside a tenant). Off by default — every
# RPC is admitted. Turn on `enabled` and set `default.rpcsPerSecond`
# + `default.burst` to apply a uniform limit; add entries under
# `overrides` for tenants that need different limits.
#
# Per-user limits are independent of the tenant-level ones; both
# buckets must have a token for the RPC to proceed. Leaving the
# per-user fields at 0 disables that dimension.
#
# rateLimit:
#   enabled: true
#   default:
#     rpcsPerSecond: 100
#     burst: 200
#     perUserRpcsPerSecond: 0
#     perUserBurst: 0
#   overrides:
#     team-a:
#       rpcsPerSecond: 500
#       burst: 1000
#       perUserRpcsPerSecond: 50
#       perUserBurst: 100
rateLimit:
  enabled: false
  default:
    rpcsPerSecond: 0
    burst: 0
    perUserRpcsPerSecond: 0
    perUserBurst: 0
  overrides: {}

# Per-tenant backend pool overrides (Phase 3.2). The `backendDiscovery`
# above is the *default* pool — used for the `default` tenant and for
# any tenant not explicitly listed below. Add an entry under
# `tenantPools.overrides` to give a specific tenant its own pool with
# its own discovery shape (static list, K8s Endpoints, etc.).
#
# `onUnknownTenant` decides what happens when an inbound RPC carries
# a tenant that has neither an entry here nor (under reject) any
# fallback pool:
#   use_default — route through the default pool (back-compat)
#   reject       — return PermissionDenied to the client
#
# tenantPools:
#   onUnknownTenant: use_default
#   overrides:
#     team-a:
#       type: static
#       addresses: ["spark-a-1:15002", "spark-a-2:15002"]
#     team-b:
#       type: k8s
#       namespace: spark-team-b
#       serviceName: spark-connect
#       port: 15002
tenantPools:
  onUnknownTenant: use_default
  overrides: {}

# How the gateway figures out which tenant each inbound RPC belongs
# to. The resolved tenant becomes the first segment of the routing
# key, so two tenants with the same session_id stay isolated.
#
# Defaults give back-compat (every RPC → tenant="default"), matching
# Phase 1/2 single-tenant behaviour. Switch `source` to from_metadata
# when auth is disabled but clients self-declare a tenant via a gRPC
# header; switch to always_default for a single-tenant deployment
# running Phase 3 code; switch `on_missing: reject` for SaaS-style
# strict isolation where a missing tenant claim is a misconfiguration.
tenantResolver:
  # one of: from_claim | from_metadata | always_default
  source: from_claim
  # Header name when source=from_metadata. Default x-tenant.
  metadataHeader: x-tenant
  # one of: use_default | reject
  onMissing: use_default
  defaultName: default

# Active gRPC health-check probing for backend pool members. When
# enabled, the gateway calls `grpc.health.v1.Health/Check` on each
# backend periodically and removes repeatedly-failing ones from the
# routing pool. Off by default to avoid breaking deployments where
# backends don't ship the standard Health service.
healthCheck:
  enabled: false
  intervalSecs: 5
  timeoutSecs: 2
  unhealthyThreshold: 3
  healthyThreshold: 2

# Graceful shutdown: on SIGTERM the gateway flips `/readyz` to 503
# (so K8s drains it from the Service), then waits for in-flight
# streaming RPCs to complete up to `deadlineSecs` before forcing
# termination. Match `terminationGracePeriodSeconds` in the pod
# spec — a too-short K8s grace will SIGKILL before drain finishes.
shutdown:
  deadlineSecs: 30

# Distributed tracing — exports OTLP/gRPC spans to a collector. Off
# by default; structured JSON logs work regardless.
tracing:
  enabled: false
  endpoint: "http://otel-collector:4317"
  serviceName: spark-connect-gateway
  sampleRatio: 1.0
  exportTimeoutSecs: 10

# ServiceAccount the gateway pods run under. Auto-created by default;
# the chart attaches RBAC for endpoints get/list/watch when
# backendDiscovery.type=k8s.
serviceAccount:
  create: true
  # If empty, the helper derives one from release fullname.
  name: ""
  annotations: {}
