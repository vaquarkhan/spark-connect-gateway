apiVersion: v2
name: scg
description: |
  Open-source Spark Connect Gateway — stateless gRPC proxy in front of a
  pool of Apache Spark Connect servers. Provides session affinity,
  multi-tenant routing, JWT/OIDC authentication, Prometheus metrics, and
  OpenTelemetry trace export. Multi-replica HA via a shared Redis
  affinity store (bundled or external).

type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.24.0-0"

home: https://github.com/liangchi-hsieh/spark-connect-gateway
sources:
  - https://github.com/liangchi-hsieh/spark-connect-gateway

keywords:
  - spark
  - spark-connect
  - gateway
  - grpc
  - proxy

maintainers:
