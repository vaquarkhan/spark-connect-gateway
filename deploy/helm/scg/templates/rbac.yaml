{{- if eq .Values.backendDiscovery.type "k8s" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scg.fullname" . }}-endpoints-watcher
  namespace: {{ .Values.backendDiscovery.k8s.namespace }}
  labels:
    {{- include "scg.gateway.labels" . | nindent 4 }}
rules:
  # The K8s pool watches the Service's Endpoints object via kube-rs
  # to track which Spark Connect pods are healthy. The standard
  # endpoints/endpointslices reads are sufficient — no writes.
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scg.fullname" . }}-endpoints-watcher
  namespace: {{ .Values.backendDiscovery.k8s.namespace }}
  labels:
    {{- include "scg.gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scg.fullname" . }}-endpoints-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "scg.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
