apiVersion: v1
kind: Service
metadata:
  name: {{ include "scg.fullname" . }}
  labels:
    {{- include "scg.gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "scg.gateway.selectorLabels" . | nindent 4 }}
