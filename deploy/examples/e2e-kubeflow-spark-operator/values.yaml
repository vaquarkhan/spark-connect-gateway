# Helm values for the Kubeflow Spark Operator integration
# walkthrough. Differs from e2e-smoke only in
# `backendDiscovery.k8s.serviceName`, which points at the
# aggregating Service defined in `spark-connect-pool.yaml`
# (which selects driver pods managed by the operator).
#
# Everything else mirrors e2e-smoke — single replica, memory
# affinity store, auth: none — to keep the only variable under
# test as the integration with the kubeflow/spark-operator
# `SparkConnect` CRD.

image:
  repository: scg
  tag: e2e
  pullPolicy: Never

replicaCount: 1

backendDiscovery:
  type: k8s
  k8s:
    namespace: default
    serviceName: scg-pool
    port: 15002

affinityStore:
  type: memory

redis:
  enabled: false

auth:
  type: none

audit:
  enabled: true
  logSuccessfulRpcs: false
